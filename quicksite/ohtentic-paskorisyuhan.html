<style id="site-style">
/* Layout: sticky ivory header over hash-routed views; maroon hero bands, ivory reading surfaces, evergreen footer. Single deliberate light palette. */
:root{
  --maroon:#4E0C18; --maroon-deep:#360811; --maroon-ink:#64101F;
  --red:#B3192B; --green:#143326; --green-mid:#235740;
  --gold:#D4AD43; --gold-soft:#E3C46A; --gold-ink:#8A6A1A;
  --ivory:#FBF6EC; --paper:#FFFCF6; --line:#E8DCC3; --line-soft:#F3EBDA;
  --ink:#2A1B1D; --ink-soft:#5C4B4D; --ink-mute:#8A7A7B; --on-dark:#FBF6EC; --on-dark-soft:#E7D9CF;
  --display:"Fraunces",Georgia,"Times New Roman",serif;
  --body:"Manrope",system-ui,-apple-system,"Segoe UI",sans-serif;
  --gutter-l:max(16px,env(safe-area-inset-left,0px)); --gutter-r:max(16px,env(safe-area-inset-right,0px));
  color-scheme:light;
}
*{box-sizing:border-box}
html{scroll-behavior:smooth}
body{background:var(--ivory);color:var(--ink);font-family:var(--body);font-size:15px;line-height:1.6;-webkit-font-smoothing:antialiased}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:60;background:var(--ivory)}
h1,h2,h3{font-family:var(--display);color:var(--maroon);font-weight:600;letter-spacing:-.015em;line-height:1.1;margin:0;text-wrap:balance}
p{margin:0}
a{color:inherit}
:focus-visible{outline:2px solid var(--gold);outline-offset:2px}
.wrap{max-width:1140px;margin:0 auto;padding-left:var(--gutter-l);padding-right:var(--gutter-r)}
.eyebrow{font-size:11px;font-weight:700;letter-spacing:.2em;text-transform:uppercase;color:var(--gold-ink)}
.dark .eyebrow{color:var(--gold-soft)}
.tba{font-style:italic;color:var(--ink-mute)}
.dark .tba{color:#BFA9A9}
.pre{white-space:pre-line}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;border-radius:999px;padding:11px 22px;font:600 14px/1.2 var(--body);text-decoration:none;border:1px solid transparent;cursor:pointer;white-space:nowrap;transition:background .2s,color .2s}
.btn-red{background:var(--red);color:var(--on-dark)} .btn-red:hover{background:#9E1424}
.btn-gold{background:var(--gold);color:var(--maroon-deep)} .btn-gold:hover{background:var(--gold-soft)}
.btn-line{border-color:#D9C4C7;color:var(--maroon-ink);background:transparent} .btn-line:hover{background:#FBF1F2}
.btn-line-light{border-color:rgba(251,246,236,.35);color:var(--on-dark);background:transparent} .btn-line-light:hover{background:rgba(255,255,255,.08)}
.btn-sm{padding:7px 14px;font-size:12.5px}
.pill{display:inline-flex;align-items:center;gap:6px;border-radius:999px;padding:4px 10px;font-size:10.5px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;background:var(--line-soft);color:var(--ink-soft);border:1px solid var(--line)}
.pill.green{background:#EEF5F1;color:var(--green-mid);border-color:#D3E6DB}
.pill.gold{background:#F7EDCF;color:var(--gold-ink);border-color:#EEDB9F}
.pill.red{background:#FBF1F2;color:var(--red);border-color:#F3DADD}
.pill.live{background:var(--red);color:var(--on-dark);border-color:var(--red)}
.card{background:var(--paper);border:1px solid var(--line);border-radius:18px;box-shadow:0 1px 0 rgba(54,8,17,.04),0 10px 26px -16px rgba(54,8,17,.25)}
.grid{display:grid;gap:20px}
.g3{grid-template-columns:repeat(auto-fit,minmax(260px,1fr))}
.g2{grid-template-columns:repeat(auto-fit,minmax(300px,1fr))}
.section{padding-block:64px}
.section-head{display:flex;flex-wrap:wrap;align-items:flex-end;justify-content:space-between;gap:16px;margin-bottom:32px}
.section-head h2{font-size:clamp(28px,4vw,38px);margin-top:10px}
.section-head p.intro{margin-top:10px;color:var(--ink-soft);max-width:60ch}
.band{border-block:1px solid var(--line);background:#F6EEDF}

/* header */
.ticker{background:var(--maroon-deep);color:var(--on-dark);font-size:13px}
.ticker .wrap{display:flex;gap:12px;align-items:center;padding-block:8px}
.ticker b{background:var(--red);border-radius:999px;padding:2px 9px;font-size:10px;letter-spacing:.14em;text-transform:uppercase;flex:none}
.ticker span{min-width:0;overflow-wrap:anywhere}
header.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:50;background:rgba(251,246,236,.94);backdrop-filter:blur(8px);border-bottom:1px solid var(--line)}
header.top .wrap{display:flex;align-items:center;justify-content:space-between;gap:12px;height:64px}
.mark{display:flex;align-items:center;gap:10px;text-decoration:none;min-width:0}
.seal{width:38px;height:38px;flex:none;border-radius:50%;background:var(--maroon);color:var(--gold-soft);display:grid;place-items:center;font:600 15px var(--display);box-shadow:inset 0 0 0 1px rgba(212,173,67,.55)}
.mark b{display:block;font:600 17px/1 var(--display);color:var(--maroon)}
.mark small{display:block;margin-top:4px;font-size:9.5px;font-weight:700;letter-spacing:.16em;text-transform:uppercase;color:var(--green-mid);white-space:nowrap}
nav.main{display:none;gap:2px}
nav.main a{text-decoration:none;font-size:13px;font-weight:500;color:var(--ink-soft);padding:8px 11px;border-radius:999px;white-space:nowrap;position:relative}
nav.main a:hover,nav.main a[aria-current]{color:var(--maroon)}
nav.main a[aria-current]::after{content:"";position:absolute;left:11px;right:11px;bottom:1px;height:2px;border-radius:2px;background:var(--gold)}
.hdr-actions{display:flex;align-items:center;gap:6px}
.menu-btn{width:40px;height:40px;border-radius:50%;border:0;background:transparent;color:var(--maroon);cursor:pointer;display:grid;place-items:center}
.menu-btn:hover{background:#FBF1F2}
.mobile-nav{border-top:1px solid var(--line);background:var(--ivory)}
.mobile-nav a{display:flex;justify-content:space-between;padding:14px 0;border-bottom:1px solid var(--line);text-decoration:none;font:500 19px var(--display);color:var(--maroon)}
.mobile-nav a span{color:var(--gold)}
@media (min-width:1180px){nav.main{display:flex}.menu-btn{display:none}.mobile-nav{display:none!important}}

/* hero */
.dark{background:var(--maroon-deep);color:var(--on-dark);position:relative;overflow:hidden}
.dark h1,.dark h2,.dark h3{color:var(--on-dark)}
.dark::before{content:"";position:absolute;inset:0;background:radial-gradient(55% 80% at 88% 8%,rgba(212,173,67,.17),transparent 62%);pointer-events:none}
.hero .wrap{position:relative;display:grid;gap:44px;padding-block:64px}
@media (min-width:980px){.hero .wrap{grid-template-columns:1.12fr 1fr;align-items:center;padding-block:88px}}
.hero h1{font-size:clamp(40px,6.4vw,70px);line-height:1.02;margin-top:18px}
.hero h1 em{color:var(--gold-soft);font-weight:500}
.hero p.lede{margin-top:22px;max-width:46ch;color:var(--on-dark-soft);font-size:16px}
.hero .ctas{display:flex;flex-wrap:wrap;gap:12px;margin-top:30px}
.ticket{border:1px solid rgba(212,173,67,.32);border-radius:22px;padding:6px;background:rgba(34,5,11,.45)}
.ticket>div{border:1px solid rgba(251,246,236,.1);border-radius:17px;padding:28px 26px}
.ticket .row{display:flex;justify-content:space-between;gap:12px;font-size:10px;font-weight:700;letter-spacing:.22em;text-transform:uppercase}
.ticket h2{font-size:clamp(28px,3.4vw,36px);margin-top:16px}
.ticket h2 span{display:block;color:var(--gold-soft)}
.ticket .date{margin-top:12px;font:500 17px var(--display);letter-spacing:.12em;text-transform:uppercase;color:var(--on-dark-soft)}
.perf{margin:24px 0;border-top:1px dashed rgba(212,173,67,.38)}
.cd{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;text-align:center}
.cd div+div{border-left:1px solid rgba(212,173,67,.28)}
.cd b{display:block;font:600 clamp(34px,5vw,48px)/1 var(--display);font-variant-numeric:tabular-nums}
.cd small{display:block;margin-top:8px;font-size:10px;font-weight:700;letter-spacing:.2em;text-transform:uppercase;color:var(--gold-soft)}
.cd-msg{font:600 clamp(26px,3.6vw,36px)/1.15 var(--display)}
.note{margin-top:14px;font-size:11.5px;color:#BFA9A9}
.chips{display:flex;flex-wrap:wrap;gap:8px;margin-top:20px}
.chips span{border:1px solid rgba(212,173,67,.45);color:#EEDB9F;border-radius:999px;padding:4px 12px;font-size:12px;font-weight:700}
.parol{position:absolute;pointer-events:none;color:var(--gold);opacity:.11}

/* stats */
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:24px}
.stats dt{font-size:11px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;color:var(--ink-mute)}
.stats dd{margin:6px 0 0;font:600 36px/1 var(--display);color:var(--maroon);font-variant-numeric:tabular-nums}
.asof{margin-top:16px;font-size:12px;color:var(--ink-mute)}
.notice{border:1px dashed #E3C46A;background:#FBF4DE;border-radius:12px;padding:14px 18px;font-size:13.5px;color:var(--ink-soft)}
.notice b{color:var(--gold-ink)}

/* category cards */
.cat{overflow:hidden;display:flex;flex-direction:column}
.cat .top{background:var(--maroon);color:var(--on-dark);padding:18px 22px 22px;position:relative}
.cat .top::after{content:"";position:absolute;left:0;right:0;bottom:0;height:4px;background:linear-gradient(90deg,var(--gold),#F0B93A,#D9692B)}
.cat .km{margin-top:22px;font:600 60px/1 var(--display);letter-spacing:-.02em}
.cat .km span{font-size:24px;color:var(--gold-soft);margin-left:4px}
.cat dl{margin:0;padding:18px 22px 22px;display:grid;grid-template-columns:1fr 1fr;gap:16px 14px;font-size:14px}
.cat dt{font-size:10.5px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;color:var(--ink-mute)}
.cat dd{margin:4px 0 0;min-width:0;overflow-wrap:anywhere}
.cat .fee{grid-column:1/-1;display:flex;justify-content:space-between;align-items:baseline;gap:10px;padding-bottom:14px;border-bottom:1px solid var(--line)}
.cat .fee dd{font:600 21px var(--display);color:var(--maroon);margin:0}
.cat .full{grid-column:1/-1}
.cat .num{font:600 26px var(--display);color:var(--maroon)}

/* lists, tiles */
.tiles{display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:1px;background:var(--line);border:1px solid var(--line);border-radius:18px;overflow:hidden}
.tile{background:var(--paper);padding:22px;text-decoration:none;display:flex;flex-direction:column;min-height:150px;transition:background .2s}
.tile:hover{background:#fff}
.tile .k{font-size:10.5px;font-weight:700;letter-spacing:.12em;text-transform:uppercase;color:var(--green-mid)}
.tile b{margin-top:auto;padding-top:26px;font:600 23px/1.15 var(--display);color:var(--maroon)}
.tile small{margin-top:4px;color:var(--ink-mute);font-size:13px}
.tile.green{background:var(--green)}.tile.green:hover{background:var(--green-mid)}
.tile.green .k{color:var(--gold-soft)}.tile.green b{color:var(--on-dark)}.tile.green small{color:#BFD3C6}
.ann{padding:22px;display:flex;flex-direction:column;gap:8px}
.ann .meta{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.ann .cat-l{font-size:10.5px;font-weight:700;letter-spacing:.12em;text-transform:uppercase;color:var(--green-mid)}
.ann h3{font-size:21px}
.ann .body{color:var(--ink-soft);font-size:14px}
.ann .foot{font-size:12px;color:var(--ink-mute)}
.ann img{border-radius:12px;border:1px solid var(--line);margin-top:6px}
.empty{padding:48px 24px;text-align:center}
.empty b{display:block;font:600 21px var(--display);color:var(--maroon);margin-top:10px}
.empty p{margin-top:6px;color:var(--ink-soft);font-size:14px}
.page-hero{border-bottom:1px solid var(--line);background:var(--paper)}
.page-hero .wrap{padding-block:52px}
.page-hero h1{font-size:clamp(34px,5vw,52px);margin-top:14px}
.page-hero p{margin-top:14px;max-width:62ch;color:var(--ink-soft);font-size:16px}
.bullets{list-style:none;margin:0;padding:0;display:grid;gap:12px}
.bullets li{display:flex;gap:12px;color:var(--ink-soft)}
.bullets li::before{content:"✦";color:var(--gold);flex:none;font-size:11px;margin-top:4px}
.rule{height:1px;background:linear-gradient(90deg,transparent,var(--gold),transparent);opacity:.7;margin:18px 0}
.facts{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:22px;border-top:1px solid rgba(251,246,236,.15);padding-top:28px;margin-top:36px}
.facts dt{font-size:10px;font-weight:700;letter-spacing:.2em;text-transform:uppercase;color:var(--gold-soft)}
.facts dd{margin:8px 0 0;font-weight:500}
.kv{display:flex;justify-content:space-between;gap:16px;padding:14px 0;border-bottom:1px solid var(--line)}
.kv span:first-child{color:var(--ink-mute);font-size:14px}
.kv span:last-child{font-weight:600;color:var(--maroon);text-align:right}
.timeline{list-style:none;margin:0;padding:0 0 0 22px;border-left:1px solid var(--gold-soft);display:grid;gap:18px}
.timeline li{position:relative}
.timeline li::before{content:"";position:absolute;left:-29px;top:26px;width:12px;height:12px;border-radius:50%;background:var(--gold);border:2px solid var(--ivory)}
.ev{padding:20px 22px;display:grid;gap:12px}
@media (min-width:700px){.ev{grid-template-columns:170px 1fr}}
.ev .when b{display:block;font:600 18px var(--display);color:var(--maroon)}
.ev .when small{color:var(--ink-mute)}
.sections{border-block:1px solid var(--line)}
.sections>div{display:grid;gap:6px;padding:18px 0;border-bottom:1px solid var(--line)}
.sections>div:last-child{border-bottom:0}
@media (min-width:700px){.sections>div{grid-template-columns:220px 1fr}}
.sections h3{font:700 12px var(--body);letter-spacing:.1em;text-transform:uppercase;color:var(--ink-soft)}
table.lb{width:100%;border-collapse:collapse;font-size:14px}
table.lb th{text-align:left;font-size:10.5px;letter-spacing:.1em;text-transform:uppercase;color:var(--ink-mute);padding:10px 12px;border-bottom:1px solid var(--line)}
table.lb td{padding:12px;border-bottom:1px solid var(--line-soft);font-variant-numeric:tabular-nums}
table.lb tr.p1 td:first-child{color:var(--gold-ink);font-weight:700}
.scroll-x{overflow-x:auto}
.podium{display:grid;grid-template-columns:1fr 1fr 1fr;align-items:end;gap:8px;max-width:560px;margin:8px auto 0}
.podium>div{text-align:center}
.podium .step{border-radius:10px 10px 0 0;color:var(--on-dark);display:grid;place-items:center;font:600 30px var(--display);box-shadow:inset 0 -10px 18px rgba(0,0,0,.18),inset 0 2px 0 rgba(255,255,255,.18)}
.podium .s1 .step{height:130px;background:linear-gradient(180deg,#D4AD43,#9C7820)}
.podium .s2 .step{height:96px;background:linear-gradient(180deg,#7A1426,#4E0C18)}
.podium .s3 .step{height:72px;background:linear-gradient(180deg,#E0843F,#B85A20)}
.podium .who{padding:8px 4px;font-size:13px;min-width:0;overflow-wrap:anywhere}
.podium .who b{display:block;font:600 15px var(--display);color:var(--maroon)}
.gallery{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:12px}
.gallery figure{margin:0}
.gallery img{width:100%;aspect-ratio:4/3;object-fit:cover;border-radius:12px;border:1px solid var(--line);display:block}
.gallery figcaption{font-size:12.5px;color:var(--ink-soft);margin-top:6px}
.filters{display:flex;gap:8px;overflow-x:auto;padding-bottom:6px}
.filters button{flex:none;border:0;border-radius:999px;padding:8px 16px;font:500 13px var(--body);background:var(--line-soft);color:var(--ink-soft);cursor:pointer}
.filters button[aria-pressed="true"]{background:var(--maroon);color:var(--on-dark)}
footer.foot{background:var(--green);color:#D9E5DD;font-size:14px;position:relative;overflow:hidden}
footer.foot .wrap{display:grid;gap:36px;padding-block:52px}

.copy{border-top:1px solid rgba(251,246,236,.12);font-size:12px;color:#9DB5A6}
.copy .wrap{padding-block:16px;display:flex;flex-wrap:wrap;justify-content:space-between;gap:8px}

/* editor */
.edit-fab{position:fixed;right:calc(18px + env(safe-area-inset-right,0px));bottom:calc(18px + env(safe-area-inset-bottom,0px));z-index:70;box-shadow:0 10px 26px -8px rgba(54,8,17,.6)}
.editor{position:fixed;inset:0;z-index:80;background:rgba(34,5,11,.4);display:flex;justify-content:flex-end}
.panel{width:min(620px,100%);height:100%;background:var(--paper);display:flex;flex-direction:column;box-shadow:-20px 0 40px -20px rgba(0,0,0,.4)}
.panel-head{padding:calc(14px + env(safe-area-inset-top,0px)) var(--gutter-r) 12px var(--gutter-l);border-bottom:1px solid var(--line);display:grid;gap:12px}
.panel-head .row{display:flex;justify-content:space-between;align-items:center;gap:10px}
.panel-head h2{font-size:22px}
.tabs{display:flex;gap:6px;overflow-x:auto;padding-bottom:2px}
.tabs button{flex:none;border:1px solid var(--line);background:var(--ivory);border-radius:999px;padding:6px 12px;font:600 12.5px var(--body);color:var(--ink-soft);cursor:pointer}
.tabs button[aria-selected="true"]{background:var(--maroon);border-color:var(--maroon);color:var(--on-dark)}
.panel-body{flex:1;overflow-y:auto;padding:20px var(--gutter-r) 28px var(--gutter-l);display:grid;gap:16px;align-content:start}
.panel-foot{border-top:1px solid var(--line);padding:12px var(--gutter-r) calc(12px + env(safe-area-inset-bottom,0px)) var(--gutter-l);display:flex;flex-wrap:wrap;align-items:center;gap:10px;background:var(--ivory)}
.panel-foot .msg{font-size:13px;flex:1;min-width:160px}
.msg.ok{color:var(--green-mid)} .msg.err{color:var(--red)}
.f{display:grid;gap:5px}
.f label{font-size:11px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--ink-soft)}
.f input,.f textarea,.f select{width:100%;border:1px solid var(--line);border-radius:9px;background:#fff;color:var(--ink);padding:9px 11px;font:14px/1.45 var(--body)}
.f textarea{min-height:84px;resize:vertical}

.f.check{display:flex;align-items:center;gap:8px}

.f.check label{text-transform:none;letter-spacing:0;font-size:13.5px;font-weight:500}
.frow{display:grid;gap:12px;grid-template-columns:repeat(auto-fit,minmax(170px,1fr))}
.item{border:1px solid var(--line);border-radius:14px;padding:14px;display:grid;gap:12px;background:var(--ivory)}
.item-head{display:flex;justify-content:space-between;align-items:center;gap:10px}
.item-head b{font:600 16px var(--display);color:var(--maroon);min-width:0;overflow-wrap:anywhere}
.linkish{border:0;background:none;color:var(--red);font:600 12.5px var(--body);cursor:pointer;padding:4px}
.ed-h{font:600 18px var(--display);color:var(--maroon);margin-top:6px}

.thumbs{display:grid;grid-template-columns:repeat(auto-fill,minmax(120px,1fr));gap:10px}
@media (prefers-reduced-motion:reduce){*{transition:none!important;scroll-behavior:auto!important}}
</style>

  var json=JSON.stringify(d).replace(/</g,"\\u003c");
  return HEAD+"<title>"+TITLE+'</title>\n<meta name="claude:viewport-fit-sides" content="cover">\n'+
    '<link rel="preconnect" href="https://fonts.googleapis.com">\n<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,500;0,9..144,600;1,9..144,500&family=Manrope:wght@400;500;600;700&display=swap">\n'+
    '<style id="site-style">'+document.getElementById("site-style").textContent+'</style>\n\n<div id="app"></div>\n\n<script type="application/json" id="site-data">'+json+"<\/script>\n\n"+
    '<script id="site-app">'+document.getElementById("site-app").textContent+"<\/script>\n</body></html>";
}
async function save(){
  var btn=document.getElementById("ed-save");btn.disabled=true;setMsg("Publishing…");
  try{var artifact=window.claude&&await window.claude.use("artifact");
    if(!artifact){setMsg("Saving is not available in this view. Open the website on claude.ai while signed in as an editor.","err");btn.disabled=false;return;}
    await artifact.publish(buildDoc(draft));setMsg("Published! The page is reloading with your changes.","ok");
  }catch(err){var c=err&&err.code;
    if(c==="conflict")setMsg("Someone else saved first. The page is reloading with their version; please redo this edit.","err");
    else if(c==="not_writer"||c==="not_granted")setMsg("Your account can view this website but not edit it. Ask the owner for edit access.","err");
    else if(c==="rate_limited")setMsg("Too many saves in a short time. Wait a minute, then save again.","err");
    else setMsg("Could not publish: "+((err&&err.message)||"unknown error"),"err");
    btn.disabled=false;}
}

render();
(async function(){try{var user=window.claude&&await window.claude.use("user");if(user&&await user.canEdit()){canEdit=true;render(true);}}catch(e){}})();
})();
</script>
